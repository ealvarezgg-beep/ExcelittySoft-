<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | ExcelittySoft</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        display: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        gold: '#D4AF37',
                        'gold-hover': '#F3E5AB',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #050508;
            background-image: 
                radial-gradient(circle at 30% 20%, rgba(212, 175, 55, 0.1), transparent 50%),
                radial-gradient(circle at 70% 80%, rgba(99, 102, 241, 0.08), transparent 50%);
            color: #ffffff;
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(15, 15, 20, 0.65);
            backdrop-filter: blur(24px) saturate(1.4);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 32px 64px -12px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255,255,255,0.04);
        }
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(20, 20, 20, 0.95);
            border-left: 4px solid #D4AF37;
            padding: 1rem 1.5rem;
            border-radius: 0.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            z-index: 50;
            display: none;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
        }
        .toast.show {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body class="antialiased flex items-center justify-center p-4 selection:bg-gold selection:text-black">

    <div class="glass-card w-full max-w-md rounded-2xl p-8 relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-gold to-transparent"></div>
        
        <div class="text-center mb-8">
            <h2 class="font-display font-bold text-2xl tracking-widest text-white mb-2">
                EXCELITTY<span class="text-gold">SOFT</span>
            </h2>
            <p class="text-gray-400 text-sm">Ingresa a tu Panel de Administración</p>
        </div>

        <form id="loginForm" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Correo Electrónico</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-500">
                        <i class="fa-solid fa-envelope"></i>
                    </div>
                    <input type="email" id="email" required placeholder="admin@tucorreo.com"
                        class="w-full bg-black/50 border border-white/10 rounded-xl pl-11 pr-4 py-3 text-white placeholder-gray-600 focus:outline-none focus:border-gold focus:ring-1 focus:ring-gold transition-colors">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Contraseña</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-500">
                        <i class="fa-solid fa-lock"></i>
                    </div>
                    <input type="password" id="password" required placeholder="••••••••"
                        class="w-full bg-black/50 border border-white/10 rounded-xl pl-11 pr-4 py-3 text-white placeholder-gray-600 focus:outline-none focus:border-gold focus:ring-1 focus:ring-gold transition-colors">
                </div>
            </div>

            <button type="submit" id="btnSubmit" 
                class="w-full bg-gold hover:bg-gold-hover text-black font-bold py-3 rounded-xl transition-all duration-300 flex justify-center items-center gap-2">
                <span>Ingresar al Sistema</span>
                <i class="fa-solid fa-arrow-right-to-bracket"></i>
            </button>
        </form>

        <div class="mt-8 text-center border-t border-white/10 pt-6">
            <p class="text-sm text-gray-500">¿Aún no tienes tu Barbería?</p>
            <a href="/app/landing.html" class="text-gold hover:text-gold-hover text-sm font-medium mt-1 inline-block transition-colors">
                Crear Prueba de 3 Días
            </a>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast">
        <div class="flex items-center gap-3">
            <i class="fa-solid fa-circle-exclamation text-rose-500 text-xl" id="toastIcon"></i>
            <div>
                <p class="text-sm text-white font-medium" id="toastMessage">Credenciales Inválidas</p>
            </div>
        </div>
    </div>

    <script>
        function showToast(message, isError = true) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').innerText = message;
            
            if(isError) {
                toast.style.borderLeftColor = '#f43f5e';
                document.getElementById('toastIcon').className = 'fa-solid fa-circle-exclamation text-rose-500 text-xl';
            } else {
                toast.style.borderLeftColor = '#D4AF37';
                document.getElementById('toastIcon').className = 'fa-solid fa-circle-check text-gold text-xl';
            }
            
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 4000);
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            const originalHtml = btn.innerHTML;
            
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> <span>Verificando...</span>';

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                if(res.ok) {
                    const data = await res.json();
                    localStorage.setItem('access_token', data.access_token);
                    localStorage.setItem('role', data.role);
                    
                    if(data.tenant_id) localStorage.setItem('tenant_id', data.tenant_id);
                    if(data.tenant_slug) localStorage.setItem('tenant_slug', data.tenant_slug);

                    // Redirect based on role
                    if(data.role === 'super_admin') {
                        window.location.href = '/app/super_admin.html';
                    } else {
                        window.location.href = '/app/tenant_admin.html';
                    }
                } else {
                    const err = await res.json();
                    showToast(err.detail || "Credenciales inválidas");
                    btn.disabled = false;
                    btn.innerHTML = originalHtml;
                }
            } catch (error) {
                showToast("Falla de red al intentar conectar");
                btn.disabled = false;
                btn.innerHTML = originalHtml;
            }
        });
    </script>
</body>
</html>
